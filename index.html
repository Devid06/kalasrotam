<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F0D0A" />

    <title>Kalasrotam — Where art flows into life</title>
    <meta
      name="description"
      content="Kalasrotam is a hand-made art studio — graphite and charcoal portraits, paintings, digital art prints and home decor. Commission a custom piece, or buy directly over WhatsApp."
    />
    <link rel="canonical" href="https://kalasrotam.com/" />

    <!-- Social preview. Swap the image once you have a real photograph of your work. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Kalasrotam — Where art flows into life" />
    <meta
      property="og:description"
      content="Hand-made graphite, charcoal, paint and digital art. Custom commissions delivered across India."
    />
    <meta property="og:image" content="./images/og-cover.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Sized down from public/images/logo.png. A tab renders at 16-32px, so
         shipping the 120KB original for it wasted bandwidth on every visit and
         let the browser do the downscaling badly. The ?v= is a cache-buster:
         browsers keep favicons in a store a hard refresh does not clear, so
         changing the mark needs a changed URL. Bump it if the icon changes. -->
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png?v=3" />
    <link rel="icon" type="image/png" sizes="64x64" href="./favicon-64.png?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=3" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Jost:wght@300;400;500;600&family=Tiro+Devanagari+Hindi:ital@0;1&display=swap"
      rel="stylesheet"
    />

    <!-- Local business structured data. Update the fields marked in src/data/site.js too. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ArtGallery",
        "name": "Kalasrotam",
        "slogan": "Where art flows into life",
        "description": "Hand-made graphite, charcoal, paintings, digital art prints and home decor. Custom commissions.",
        "address": { "@type": "PostalAddress", "addressCountry": "IN" },
        "priceRange": "₹₹"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
